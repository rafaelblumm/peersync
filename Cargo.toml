[package]
name = "sync2peer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
log = "0.4.34"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
simplelog = "0.12.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
yaml_serde = "0.10.7"
